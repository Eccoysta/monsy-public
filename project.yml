name: Monsy
options:
  bundleIdPrefix: com.eccoysta
  deploymentTarget:
    iOS: 16.0
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Monsy
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.eccoysta.monsy
targets:
  Monsy:
    type: application
    platform: iOS
    sources:
      - path: Monsy
    resources:
      - path: Monsy/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eccoysta.monsy
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
